name: E2E Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL publicada alvo dos testes E2E"
        required: false
        default: "https://titanloterias.lovable.app"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://titanloterias.lovable.app' }}
      # Sem estas credenciais, e2e/gerador.spec.ts faz test.skip() e o único
      # cenário autenticado do projeto nunca era executado — o CI passava
      # "verde" sem ter testado o fluxo principal.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.project }}
          restore-keys: |
            pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      - name: Run Playwright tests
        run: npm run test:e2e -- --project=${{ matrix.project }} --reporter=list,blob,html
        env:
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.project }}.zip

      - name: Upload per-browser HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14

      - name: Upload blob report (for merge)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report
          retention-days: 3

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results
          retention-days: 7

  merge-reports:
    name: Merge reports (all browsers)
    if: always()
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Merge into JSON (para matriz)
        run: npx playwright merge-reports --reporter json ./all-blob-reports > merged.json

      - name: Gerar matriz HTML + CSV
        run: node scripts/e2e-matrix.mjs merged.json playwright-report/matrix.html playwright-report/matrix.csv

      - name: Upload unified HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report
          retention-days: 14

      - name: Upload matriz standalone (HTML + CSV)
        uses: actions/upload-artifact@v4
        with:
          name: playwright-matrix
          path: |
            playwright-report/matrix.html
            playwright-report/matrix.csv
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Playwright E2E — Relatório unificado"
            echo ""
            echo "- **playwright-report-merged**: HTML navegável com os 3 navegadores + \`matrix.html\` incluso."
            echo "- **playwright-matrix**: apenas a página \`matrix.html\` (teste × navegador)."
            echo "- Relatórios individuais: \`playwright-report-{chromium,firefox,webkit}\`."
          } >> "$GITHUB_STEP_SUMMARY"
